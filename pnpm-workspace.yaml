packages:
  - .
  - ./cdk
  - ./docs
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.23.0
  - '@solidjs/signals@2.0.3'
  - '@solidjs/web@2.0.3'
  - solid-js@2.0.3
  - solid-styled@1.0.0

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
